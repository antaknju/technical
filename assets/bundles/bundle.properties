item.technical-clay.name = Clay
item.technical-clay.description = Primary Resource, makes bricks when dried out, may contain trace amounts of flint shards and creates porcelain when smelted

item.technical-stone.name = Stone
item.technical-stone.description = Basic Resource, used like foundation for crude machines

item.technical-coal.name = Coal
item.technical-coal.description = Core Resource, used to power crude machines and can be used as fuel for furnaces

item.technical-brick.name = Brick
item.technical-brick.description = Successor material of stone, used like basis for more controlled machinery

item.technical-porcelain.name = Porcelain
item.technical-porcelain.description = Material, with high temeprature stability and low thermal expansion ideal for thermal conductors and cheap pipes

item.technical-flint.name = Flint
item.technical-flint.description = Basic Material, sieved out from the clay

item.technical-precision-mechanism.name = Precision Mechanism
item.technical-precision-mechanism.description = Advanced Core Mechanical Structure, powered by precise gears for very accurate and predictable movement

item.technical-raw-copper.name = Raw Copper
item.technical-raw-copper.description = Primary Resource, can be smelted into copper plates in controlled temperatures

item.technical-copper-plate.name = Copper Plate
item.technical-copper-plate.description = Primary Material used to craft mechanical components and used for more advanced processing

item.technical-copper-gear.name = Copper Gear
item.technical-copper-gear.description = Material used for producing precission mechanism and other mechanical components

item.technical-raw-iron.name = Raw Iron
item.technical-raw-iron.description = Primary Resource, can be smelted into iron plate, doesn't need controlled environment for smelting

item.technical-iron-plate.name = Iron Plate
item.technical-iron-plate.description = Core Material used to craft basicly everything, very important for future progress

item.technical-iron-gear.name = Iron Gear
item.technical-iron-gear.description = Material used for producing precission mechanism and other mechanical components

#### SCIENCE PACKS ####

item.technical-metalurgy-xp.name = Metalurgy Science Pack
item.technical-metalurgy-xp.description = Used to unlock new metalurgy technologies, that help your machines be more efficient

