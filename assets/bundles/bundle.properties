block.technical-brick-wall-large.description = Really advanced use of curde resources, into one of the most powerful and complicated technologies that you can build; The Wall
block.technical-brick-wall-large.details = Did you get it, didn't you?

block.technical-iron-trap-hook.name = Iron Trap Hook
block.technical-iron-trap-hook.description = Can be connected to each other to make a trap string, when something breaks the string, touching traps are activated. It needs time to replace string.
