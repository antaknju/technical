#################

block.technical-iron-drill.name = Iron Drill
block.technical-iron-drill.description = Crude drill that uses coal to mine minerals from the ground. If it mines coal it takes care of itself, and outputs excess coal. But it still needs coal to start the process.
# block.technical-iron-drill.details = 

block.technical-stone-crusher.name = Stone Crusher
block.technical-stone-crusher.description = Mines stone out of the stone walls. It needs coal to work.
# block.technical-stone-crusher.details = 

