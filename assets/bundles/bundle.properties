#   EXTENSIONS  #
#################

block.technical-basic-control-panel.name = Basic Control Panel
block.technical-basic-control-panel.description = Controls Extendables, used to control advanced machines
# block.technical-basic-control-panel.details = 

block.technical-grill-heater.name = Grill Heater
block.technical-grill-heater.description = Heats Extendables, used to accelerate and enable some high temperature processes
# block.technical-grill-heater.details = 

block.technical-solar-heater.name = Solar Heater
block.technical-solar-heater.description = Heats Touching Extendables to accelerate processes, using solar power. Not very efficient
# block.technical-solar-heater.details = 

block.technical-stone-chimney.name = Stone Chimney
block.technical-stone-chimney.description = Emits smoke and exhaust from Extendables. Not very environmentally friendly...
block.technical-stone-chimney.details = Living beaing don't like those, so you should be carefull

block.technical-basic-crusher.name = Basic Crusher
block.technical-basic-crusher.description = Crushes raw materials to accelerate or enable Crafter Processes
# block.technical-basic-crusher.details = 

block.technical-liquid-storage.name = Liquid Storage
block.technical-liquid-storage.description = Stores liquids for Extendables. Pretty usefull for burst machines
# block.technical-liquid-storage.details = 

block.technical-fan.name = Fan
block.technical-fan.description = Cools Extendables by removing heat, uses cooling liquids for more efficiency. Helps with maintaining stability of the machines
block.technical-fan.details = Does it mean, that Extendables can explode!?

#################
#    CRAFTERS   #
#################

block.technical-circuit-cutter.name = Circuit Cutter
block.technical-circuit-cutter.description = Performs cutting actions on moving circuits on roller conveyors. Used for advanced, chain processes.
# block.technical-circuit-cutter.details = 

block.technical-circuit-iron-applicator.name = Circuit Iron Applicator
block.technical-circuit-iron-applicator.description = Applies small iron elements onto moving circuits on roller conveyors. Used for advanced, chain processes.
# block.technical-circuit-iron-applicator.details = 

block.technical-circuit-conductor-applicator.name = Circuit Conductor Applicator
block.technical-circuit-conductor-applicator.description = Applies copper conductors onto moving circuits on roller conveyors. Used for advanced, chain processes.
# block.technical-circuit-conductor-applicator.details = 

block.technical-drying-pad.name = Drying Pad
block.technical-drying-pad.description = Dries and processes clay into bricks. Can be extended with heaters in the future
block.technical-drying-pad.details = First step into the world of Technical Machinery

block.technical-brick-furnace.name = Brick Furnace
block.technical-brick-furnace.description = Furnaces raw iron into the iron plates. Pretty slow, because it works on low tempreatures, is is recommended to extend it with external heaters
# block.technical-brick-furnace.details = 

block.technical-basic-ammo-forge.name = Basic Ammo Forge
block.technical-basic-ammo-forge.description = Processes iron plates into dense ammunition for turrets. Needs coal to operate.
# block.technical-basic-ammo-forge.details = 

#################
#    POWER      #
#################

block.technical-nuclear-reactor.name = Nuclear Reactor
block.technical-nuclear-reactor.description = Generates massive power using radioactivity of uranium. If it is too cold or too hot it can [scarlet]explode![] It needs advanced controlling to operate without any unpleasant surprises
block.technical-nuclear-reactor.details = Not safe technology, so please be careful

#################
#   TRANSPORT   #
#################

block.technical-roller-conveyor.name = Roller Conveyor
block.technical-roller-conveyor.description = Transports items between machines. Additionally used in advanced processing.
# block.technical-roller-conveyor.details = 

block.technical-iron-inserter.name = Iron Inserter
block.technical-iron-inserter.description = Moves items over short distances, can unload items from storage block, insert items into machines, separate items to more tracks, sort items, extract only needed item. But it needs coal to work.
block.technical-iron-inserter.details = One of my favourite block in this game

block.technical-iron-catapult.name = Iron Catapult
block.technical-iron-catapult.description = Launches items into the air to across distances.
# block.technical-iron-catapult.details = 

block.technical-electric-inserter.name = Electric Inserter
block.technical-electric-inserter.description = Electric powered inserter for fast and efficient transport
# block.technical-electric-inserter.details = 

block.technical-basic-rail-connector.name = Basic Rail Connector
block.technical-basic-rail-connector.description = Can connect to 2 additional connectors to make track between. Used to create train traction networks, for long distance, efficient transport.
# block.technical-basic-rail-connector.details = 

block.technical-train-fabricator.name = Train Fabricator
block.technical-train-fabricator.description = Constructs 1 train if placed towards Rail Connector.
# block.technical-train-fabricator.details = 

block.technical-train-loader.name = Train Loader
block.technical-train-loader.description = Loads items onto trains that are going nearby loader side, need to be placed towards Rail Connector
# block.technical-train-loader.details = 

block.technical-train-unloader.name = Train Unloader
block.technical-train-unloader.description = Unloads items from trains that are going nearby unloading side, need to be placed towards Rail Connector
# block.technical-train-unloader.details = 

block.technical-train-payload-loader.name = Train Payload Loader
block.technical-train-payload-loader.description = Loads payload onto trains that are going nearby loader side, need to be placed towards Rail Connector
# block.technical-train-payload-loader.details = 

block.technical-train-payload-unloader.name = Train Payload Unloader
block.technical-train-payload-unloader.description = Unloads payloads from trains that are going nearby unloading side, need to be placed towards Rail Connector
# block.technical-train-payload-unloader.details = 

