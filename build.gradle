import java.util.regex.Pattern

apply plugin: "java"

version = '1.0'

sourceSets.main.java.srcDirs = ["src"]

repositories{
    mavenCentral()

    //Downloads the server-release JAR file from Mindustry releases; does not use any real repository. Surprisingly, this is the most reliable option.
    ivy{
        url 'https://github.com/'
        patternLayout{artifact '/[organisation]/[module]/releases/download/[revision]/dependencies.jar'}
        metadataSources{ artifact() }
    }

    //"Latest" option to depend on BE builds.
    ivy{
        url 'https://github.com/'
        patternLayout{artifact '/[organisation]/[module]/releases/download/master/[revision].jar'}
        metadataSources{ artifact() }
    }

    //Do the same with jabel
    ivy{
        url 'https://github.com/'
        patternLayout{artifact '/[organisation]/[module]/releases/download/[revision]/jabel.jar'}
        metadataSources{ artifact() }
    }
}

java{
    targetCompatibility = 8
    sourceCompatibility = JavaVersion.VERSION_17
}

ext{
    mindustryVersion = 'v156' //the build number that this mod is made for
    jabelVersion = "93fde537c7"
    isWindows = System.getProperty("os.name").toLowerCase().contains("windows")
    sdkRoot = System.getenv("ANDROID_HOME") ?: System.getenv("ANDROID_SDK_ROOT")
}

//java 8 backwards compatibility flag
allprojects{
    tasks.withType(JavaCompile).tap{
        configureEach{
            options.compilerArgs.addAll(['--release', '8'])
        }
    }
}

dependencies{
    def useLatest = false //set to "true" to always depend on the newest version of mindustry

    compileOnly useLatest ? "Anuken:MindustryBuilds:latest" : "Anuken:Mindustry:$mindustryVersion"

    annotationProcessor "Anuken:jabel:v1.0.0"
}

tasks.register('jarAndroid'){
    dependsOn "jar"

    doLast{
        if(!sdkRoot || !new File(sdkRoot as String).exists()) throw new GradleException("No valid Android SDK found. Ensure that ANDROID_HOME is set to your Android SDK directory.")

        def platformRoot = new File("$sdkRoot/platforms/").listFiles().sort().reverse().find{ f -> new File(f, "android.jar").exists() }

        if(!platformRoot) throw new GradleException("No android.jar found. Ensure that you have an Android platform installed.")

        //collect dependencies needed for desugaring
        def dependencies = (configurations.compileClasspath.asList() + configurations.runtimeClasspath.asList() + [new File(platformRoot, "android.jar")]).collect{ "--classpath $it.path" }.join(" ")

        def d8 = isWindows ? "d8.bat" : "d8"

        //dex and desugar files - this requires d8 in your PATH
        "$d8 $dependencies --min-api 14 --output ${project.name}Android.jar ${project.name}Desktop.jar"
                .execute(null, new File("build/libs")).waitForProcessOutput(System.out, System.err)
    }
}

def getModVersion() {
    def modFile = file('mod.hjson')
    if (!modFile.exists()) return 'unknown'
    def matcher = Pattern.compile(/version\s*[:=]\s*["']?([0-9a-zA-Z.+-]+)["']?/).matcher(modFile.text)
    return matcher.find() ? matcher.group(1) : 'unknown'
}


jar{
    archiveFileName = "${project.name}Desktop.jar"

    manifest {
        attributes(
                'Implementation-Title': project.name,
                'Implementation-Version': getModVersion(),
                'Created-By': 'AnTakNju',
                'Build-Jdk': System.getProperty('java.version'),
                'Built-By': "Gradle ${gradle.gradleVersion}",
                'License': 'GNU AGPLv3'
        )
    }

    from{
        configurations.runtimeClasspath.collect{ it.isDirectory() ? it : zipTree(it) }
    }

    from(projectDir){
        include "mod.hjson"
    }

    from("assets/"){
        include "**"
    }
}

tasks.register('deploy', Jar){
    dependsOn jarAndroid
    dependsOn jar
    archiveFileName = "${project.name}.jar"

    from{ [zipTree("build/libs/${project.name}Desktop.jar"), zipTree("build/libs/${project.name}Android.jar")] }

    doLast{
        delete{
            delete "build/libs/${project.name}Android.jar"
        }
    }
}

tasks.register('version') {
    group = 'versioning'
    doLast {
        def modFile = file('mod.hjson')
        def readmeFile = file('README.md')

        if (!modFile.exists()) throw new GradleException("mod.hjson not found!")

        // 1. Handle mod.hjson Bumping
        def modContent = modFile.text
        def modMatcher = Pattern.compile(/version\s*[:=]\s*["']?([0-9a-zA-Z.+-]+)["']?/).matcher(modContent)

        if (modMatcher.find()) {
            String oldVersion = modMatcher.group(1)
            def parts = oldVersion.split(/\+/)
            if (parts.length < 2) throw new GradleException("Version needs +build suffix (e.g. +001)")

            String baseVersion = parts[0] // e.g., 1.0.0-alpha
            int nextBuild = parts[1].toInteger() + 1
            String newVersion = "${baseVersion}+${String.format("%03d", nextBuild)}"

            modFile.write(modContent.replaceFirst(Pattern.quote(oldVersion), newVersion))
            println "version build update: $oldVersion -> $newVersion"

            // 2. Handle README.md Badge Updating
            if (readmeFile.exists()) {
                def readmeContent = readmeFile.text

                // Extract "Alpha" or "Beta" from "1.0.0-alpha" and capitalize it
                def stateMatch = (baseVersion =~ /-(.*)$/)
                String rawState = stateMatch.find() ? stateMatch.group(1) : "Release"
                String capitalizedState = rawState.capitalize()

                // Shields.io uses double dashes for dashes in text
                String badgeState = capitalizedState.replace("-", "--")

                // Regex to find the State badge URL and the Alt text
                // Matches: State-Anything-red AND alt="Anything State Badge"
                def badgeUrlPattern = /State-[a-zA-Z0-9--]+-red/
                def altPattern = /alt="[a-zA-Z0-9 ]+ State Badge"/

                String newReadme = readmeContent.replaceAll(badgeUrlPattern, "State-${badgeState}-red")
                newReadme = newReadme.replaceAll(altPattern, "alt=\"${capitalizedState} State Badge\"")

                String badgeVersion = newVersion.replace("-", "--")
                newReadme = newReadme.replaceAll(/Version-[a-zA-Z0-9.+\-]+-blue/, "Version-${badgeVersion}-blue")

                readmeFile.write(newReadme)
            }
        } else {
            throw new GradleException("Could not find version in mod.hjson")
        }
    }
}

tasks.register('inject', Copy) {
    group = 'distribution'
    dependsOn 'jar'

    def destDir = file("${System.getProperty("user.home")}/.local/share/Mindustry/mods")

    from layout.buildDirectory.dir("libs")
    into destDir

    // Delete ONLY this mod's previous versions
    doFirst {
        def name = base.archivesName.get()
        fileTree(destDir).include("${name}*.jar").forEach { it.delete() }
        println "Cleared previous builds of $name"
    }
}

tasks.register('bungen') {
    dependsOn 'bungen-content', 'bungen-enum'
}

tasks.register('bungen-content') {
    doLast {
        def contentDir = file("${project.projectDir}/src/technical/content")
        def bundleFile = file("${project.projectDir}/assets/bundles/bundle.properties")

        if (!bundleFile.exists()) {
            bundleFile.parentFile.mkdirs()
            bundleFile.createNewFile()
        }

        def lines = bundleFile.readLines()

        // Normalize keys
        def normalize = { it.replaceAll("\\s+", "") }

        def existingKeys = lines
                .findAll { it.contains("=") }
                .collect { normalize(it.split("=")[0]) }
                .toSet()

        def existingSections = lines
                .findAll { it ==~ /#+\s+[A-Z]+\s+#+/ }
                .collect { it.replaceAll("#", "").trim().toLowerCase() }
                .toSet()

        def fileMap = [
                "TBlocks.java"  : "block",
                "TUnits.java"   : "unit",
                "TItems.java"   : "item",
                "TLiquids.java" : "liquid",
                "TSectors.java" : "sector",
                "TStatuses.java": "status"
        ]

        def outputSections = [:].withDefault { [] }

        fileMap.each { fileName, prefix ->
            def file = new File(contentDir, fileName)
            if (!file.exists()) return

            def fileLines = file.readLines()

            for (int i = 0; i < fileLines.size(); i++) {
                def line = fileLines[i]

                // Ignore marker
                if (i > 0 && fileLines[i - 1].contains("/// BUNGEN IGNORE")) {
                    continue
                }

                // exactly 8 spaces
                def matcher = line =~ /^ {8}[a-zA-Z0-9_]+\s*=\s*new\s+\w+\("([^"]+)"\)\s*\{\{/
                if (!matcher.find()) continue

                def name = matcher.group(1)

                def keyBase = "${prefix}.technical-${name}"
                def nameKey = normalize("${keyBase}.name")

                // duplicate protection
                if (existingKeys.contains(nameKey)) continue

                existingKeys.add(nameKey)

                def formattedName = name
                        .replace("-", " ")
                        .split(" ")
                        .collect { it.capitalize() }
                        .join(" ")

                outputSections[prefix] += [
                        "${keyBase}.name = ${formattedName}",
                        "${keyBase}.description = GENERATED",
                        "# ${keyBase}.details = "
                ]
            }
        }

        if (outputSections.isEmpty()) {
            println "No new entries added. Terminating."
            return
        }

        def builder = new StringBuilder()

        outputSections.each { prefix, entries ->
            if (entries.isEmpty()) return

            def sectionHeader = "######################### ${prefix.toUpperCase()} #########################"

            if (!existingSections.contains(prefix)) {
                builder.append("\n${sectionHeader}\n\n")
            } else {
                builder.append("\n")
            }

            for (int i = 0; i < entries.size(); i += 3) {
                builder.append(entries[i]).append("\n")
                builder.append(entries[i + 1]).append("\n")
                builder.append(entries[i + 2]).append("\n\n")
            }
        }

        def output = builder.toString()

        println "\nBUNGEN ENTRIES ADDED"
        println output

        bundleFile << output

        println "Bundle generation complete."
    }
}

tasks.register('bungen-enum') {
    doLast {
        def srcDir = file("${project.projectDir}/src")
        def bundleFile = file("${project.projectDir}/assets/bundles/bundle.properties")

        if (!bundleFile.exists()) {
            bundleFile.parentFile.mkdirs()
            bundleFile.createNewFile()
        }

        def lines = bundleFile.readLines()
        def normalize = { it.replaceAll("\\s+", "") }

        def existingKeys = lines
                .findAll { it.contains("=") }
                .collect { normalize(it.split("=")[0]) }
                .toSet()

        def enumHeader = "######################### ENUM #########################"
        def hasEnumSection = lines.any { it == enumHeader }

        def outputMap = [:].withDefault { [] }

        srcDir.eachFileRecurse { file ->
            if (!file.name.endsWith(".java")) return

            def fileLines = file.readLines()

            boolean shouldProcessNextEnum = false
            String currentEnum = null

            for (int i = 0; i < fileLines.size(); i++) {
                def line = fileLines[i].trim()

                if (line.contains("/// BUNGEN ENUM")) {
                    shouldProcessNextEnum = true
                    continue
                }

                def enumMatch = line =~ /enum\s+([a-zA-Z0-9_\-]+)/
                if (shouldProcessNextEnum && enumMatch.find()) {
                    currentEnum = enumMatch.group(1)
                    shouldProcessNextEnum = false
                    continue
                }

                if (currentEnum && line.contains("}")) {
                    currentEnum = null
                    continue
                }

                if (!currentEnum) continue

                if (i > 0 && fileLines[i - 1].contains("/// BUNGEN IGNORE")) {
                    continue
                }

                def constant = line
                        .replace(",", "")
                        .replaceAll(/\(.*\)/, "")
                        .trim()

                if (!constant.matches(/[A-Za-z0-9_]+/)) continue

                def kebab = constant
                        .replaceAll(/([a-z])([A-Z])/, '$1-$2')
                        .toLowerCase()

                def kebabEnum = currentEnum
                        .replaceAll(/([a-z])([A-Z])/, '$1-$2')
                        .toLowerCase()

                def key = normalize("enum.${kebabEnum}.${kebab}")
                if (existingKeys.contains(key)) continue
                existingKeys.add(key)

                def formatted = kebab
                        .split("-")
                        .collect { it.capitalize() }
                        .join(" ")

                outputMap[kebabEnum] << "enum.${kebabEnum}.${kebab} = ${formatted}"
            }
        }

        if (outputMap.isEmpty()) {
            println "No new enum entries. Terminating."
            return
        }

        // build grouped output with spacing
        StringBuilder builder = new StringBuilder()

        outputMap.each { enumName, entries ->
            entries.each {
                builder.append(it).append("\n")
            }
            builder.append("\n") // spacing between enum types
        }

        def output = builder.toString()

        println "\nBUNGEN ENUM ENTRIES ADDED"
        println output

        if (!hasEnumSection) {
            // create section if missing
            bundleFile << "\n${enumHeader}\n\n${output}"
        } else {
            // insert right after ENUM header
            def index = lines.findIndexOf { it == enumHeader }

            def newLines = []
            newLines.addAll(lines[0..index])
            newLines.add("") // spacing
            newLines.addAll(output.readLines())
            newLines.addAll(lines[(index + 1)..<lines.size()])

            bundleFile.text = newLines.join("\n")
        }

        println "Enum bundle generation complete."
    }
}